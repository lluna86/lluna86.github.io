<form action="https://formspree.io/f/xqkoazln" method="POST" class="space-y-4">
    <div>
        <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
        <input type="email" name="email" id="email" class="shadow-sm bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2" placeholder="email@email.com" required>
    </div>
    <div class="sm:col-span-2">
        <label for="message" class="block mb-2 text-sm font-medium text-gray-900">Missatge</label>
        <textarea id="message" name="message" rows="6" class="block p-2 w-full text-sm text-gray-900 bg-gray-50 rounded-lg shadow-sm border border-gray-300 focus:ring-primary-500 focus:border-primary-500" placeholder="Escriu el teu missatge"></textarea>
    </div>
    <!-- Checkbox para Términos y Condiciones -->
    <div class="flex items-start">
        <div class="flex items-center h-5">
            <input id="terms" type="checkbox" class="w-4 h-4 bg-gray-50 rounded border border-gray-300 focus:ring-primary-500 focus:ring-2" required>
        </div>
        <label for="terms" class="ml-2 text-sm font-medium text-gray-900">He llegit i accepto <a href="/ca/legal" class="text-planta hover:underline hover:text-planta-fosc">les condicions d'ús</a>.</label>
    </div>
    <button type="submit" class="mt-4 px-6 py-2 text-xl text-white bg-planta hover:bg-planta-fosc rounded">Enviar</button>
</form>
