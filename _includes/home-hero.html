{% assign lang = include.lang | default: page.lang | default: "es" %}
{% assign home = site.data.home[lang] %}
{% assign contact = site.data.contact %}
{% assign copy = contact[lang] %}

<div class="flex flex-wrap">
    <div class="bg-cover bg-top sm:bg-bottom bg-[url('/assets/images/jar-vertical.webp')] sm:bg-[url('/assets/images/jar.webp')] w-full h-screen flex justify-center items-center">
        <div class="text-white text-3xl font-bold text-center">
            <h1 class="font-quicksand text-3xl text-gray-800 sm:text-white sm:text-5xl font-semibold text-center">Berta Sanfeliu</h1>
            <h2 class="sm:text-xl text-center text-gray-800 sm:text-white">{{ home.hero_subtitle }}</h2>
            <a class="inline-block mt-4 px-6 py-2 text-2xl text-white bg-planta hover:bg-planta-fosc rounded" target="_blank" rel="noopener" href="{{ copy.whatsapp_url }}">{{ home.hero_cta }}</a>
        </div>
    </div>
</div>
