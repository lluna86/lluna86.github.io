source_name: "Doctoralia"
source_url: "https://www.doctoralia.es/berta-sanfeliu-salva/psicologo/barcelona"
items:
  - author: "S.B"
    date: "18 de enero de 2026"
    lang: "es"
    text: "Berta es muy profesional y cercana. Desde el primer día las sesiones con ella son cómodas y claras, y me están ayudando mucho. La recomiendo sin duda."
  - author: "Y.l"
    date: "29 de mayo de 2025"
    lang: "es"
    text: "La dra Berta es encantadora, hemos tenido recién la primera sesión para nuestro peque, pero nos encantó. Volveremos sin duda."
  - author: "MC"
    date: "28 de mayo de 2025"
    lang: "ca"
    text: "Molt professional i dedicada. De seguida vam anar per feina i vam començar a treballar. He notat moltíssim la tasca que hem fet, em sento millor i em gestiono millor."
  - author: "NM"
    date: "18 de diciembre de 2024"
    lang: "ca"
    text: "Gran professional, amb un tracte proper i respectuós. Transmet molta confiança per poder-se obrir a parlar dels conflictes i les emocions."
  - author: "IW"
    date: "6 de noviembre de 2025"
    lang: "en"
    text: "Berta was amazing. She really took the time to listen and provided practical, thoughtful tips for managing each situation."
  - author: "Yasmin"
    date: "11 de febrero de 2025"
    lang: "en"
    text: "Berta made me feel extremely welcomed and comfortable from the first visit. I definitely felt a positive impact on my life."
